# configs/lab_xrf.yml
# XRF instrument configuration — all distances in cm

paths:
  compositions:   data/compositions
  output_dir:     results/lab_xrf

# Samples to run: file names in paths.compositions, without .yml.
# Each file lists the mass fraction of each element under `composition:`.
samples: ["soil_14163"]

# Include secondary (inter-element) K fluorescence enhancement.
# true → Intensity_ph_s = primary + secondary (matches fisx secondary=2 minus tertiary)
# false → primary only (Shiraiwa integral, original behaviour)
include_secondary: true

# ── X-ray tube (spectrum generated with SpekPy, see src/xrf_model/tube.py) ────
# With this block present, run the pipeline with flux_file=None.
tube:
  kvp: 50                          # tube voltage [kV]
  target: Ag                       # anode material
  transmission_thickness_um: 1.0   # transmission target thickness [µm]
  filters:                         # tube exit window and filters, thickness [mm]
    Be: 0.125                      # (not the detector window, be_window_mm below)
  energy_step_keV: 0.03            # spectrum bin width [keV]
  current_mA: 0.002                # tube current [mA]

# ── Instrument geometry (cm) ───────────────────────────────────────────────
# The sample surface is the plane z = 0, the analysed spot is at the origin,
# and z points up, away from the sample. The formulas below place tube and
# detector in the x–z plane on opposite sides (tube at x < 0, detector at x > 0).
#
# From the lab measurements:
#   θ = angle between the beam axis and the surface normal [deg]
#   D = straight-line distance from the spot to the point [cm]
#   x = ∓ D · sin θ   (− for the tube, + for the detector)
#   z =   D · cos θ   (the height above the surface)
# If you measured the height h instead of D:  x = ∓ h · tan θ,  z = h
#
# Tube: the point is the focal spot (for a transmission target, the target
# just behind the exit window).
src_x: -3.0
src_y:  0.0
src_z:  3.0

# Detector: the point is the centre of the Si crystal, behind its window.
det_x:  3.0
det_y:  0.0
det_z:  3.0

# Detector inward normal (pointing FROM the detector TOWARD the sample).
# If the detector points at the spot: [-det_x, -det_y, -det_z]
# (the code normalises it).
det_normal: [-0.707, 0.0, -0.707]

# Detector active area [cm²]: the collimated area from the datasheet,
# mm² / 100 (e.g. 17 mm² → 0.17).
det_area: 0.17

# ── Atmosphere ────────────────────────────────────────────────────────────────
# Gas between tube, sample and detector: vacuum (no absorption) or air
# (dry air at sea level, NIST composition, 1.205e-3 g/cm³).
atmosphere: air

# Part of each path that is inside the housing, in vacuum [cm]: from the focal
# spot to the tube exit window, and from the Si crystal to the detector window
# (from the datasheets). The air path is the distance to each cell minus this.
src_vacuum_path_cm: 0.0
det_vacuum_path_cm: 0.0

# ── Grid definition (cm) ──────────────────────────────────────────────────
# The code has no beam-footprint model, so the grid IS the illuminated area,
# lit uniformly: set it to the beam spot on the sample.
# A round beam of diameter D hitting the surface at θ from the normal makes
# an ellipse D/cos θ long in x and D wide in y. A grid with the same area
# and shape:
#   grid_x_max = −grid_x_min = 0.443 · D / cos θ
#   grid_y_max = −grid_y_min = 0.443 · D          (0.443 = √π / 4)
# For a collimator bore of diameter d and length L, with its exit at distance
# g from the spot along the beam, D lies between d and d · (1 + g/L),
# whatever the distance from the focal spot to the collimator.
# 2×2 points is within 0.25% of a fine grid for a ±0.4 cm grid at 45°;
# check against a finer grid when the geometry changes.
grid_x_min: -0.4
grid_x_max:  0.4
grid_n_x:    2

grid_y_min: -0.4
grid_y_max:  0.4
grid_n_y:    2

# ── Detector response ────────────────────────────────────────────────────────
be_window_mm:       0.0127  # Be entrance window thickness [mm], from the datasheet (12.7 µm = 0.0127)
si_active_layer_um: 450.0   # Active Si crystal thickness [µm] — sets high-E quantum efficiency

# Broadening of each deposited energy E:  σ² = F · w · E + σ_el²
# F and w must be the pair used in the calibration that measured F.
detector_fano:     0.1180   # effective Fano factor F
detector_w_eV:     3.65     # energy per electron-hole pair w [eV]
detector_noise_eV: 12.7     # electronic noise σ_el [eV rms]

# Optional Monte Carlo response matrix: the energy deposited in the detector
# per photon, BEFORE electronic broadening (the broadening above is applied
# on top). Without it, every peak is a pure Gaussian.
# The file is a NumPy .npz with three arrays:
#   energy_in_keV      (N_in,)       photon energy of each row, increasing
#   channel_edges_keV  (N_ch + 1,)   edges of the deposited-energy channels, equal width
#   response           (N_in, N_ch)  probability that a photon of energy_in_keV[i]
#                                    deposits an energy in channel j
# rows: per_detected_photon  → each row sums to 1 (per photon that left energy
#                              in the crystal); the code applies the Be window
#                              and the Si efficiency (photoelectric + Compton)
#       per_incident_photon  → each row sums to the detection efficiency; window
#                              and efficiency are already in the matrix
# The spectrum is then written on the matrix channels. The file is kept on
# this computer only (*.npz is git-ignored); remove this block to run without it.
detector_response:
  file: matrice_RMF_FastSDD_no_broadening.npz
  rows: per_detected_photon

# ── .mca output ───────────────────────────────────────────────────────────────
# Counts per channel = rate × mca_live_time_s (seconds of live time).
mca_live_time_s: 1.0

# Channels of the real MCA, so the simulated .mca lines up channel by channel
# with a measurement: a PyMca .calib file, E(ch) = A + B·ch + C·ch² [keV], and
# the number of channels. Use the calibration made at the same gain setting as
# the measurement (the .mca files record it as GAIN= in their DP5 section).
# The calib_file/ folder is kept on this computer only (git-ignored).
# Without these two keys, the .mca uses the spectrum's own energy grid.
mca_calibration: calib_file/cal_Am241_Fe55_Ce137_gain7.5_2.calib
mca_channels: 8192
