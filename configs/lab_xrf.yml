# configs/lab_xrf.yml
# XRF instrument configuration — all distances in cm

paths:
  element_data:   data/element_params/Data_keV.xlsx
  form_factors:   data/form_factors/form_factor_coherent_scatter.xlsx
  absorption_dir: data/absorption_coeffs
  output_dir:     results/lab_xrf

concentration_cols: ["soil_14163"]

# Include secondary (inter-element) K fluorescence enhancement.
# true → Intensity_ph_s = primary + secondary (matches fisx secondary=2 minus tertiary)
# false → primary only (Shiraiwa integral, original behaviour)
include_secondary: true

# ── X-ray tube (spectrum generated with SpekPy, see src/xrf_model/tube.py) ────
# With this block present, run the pipeline with flux_file=None.
tube:
  kvp: 50                          # tube voltage [kV]
  target: Ag                       # anode material
  transmission_thickness_um: 1.0   # transmission target thickness [µm]
  filters:                         # tube exit window and filters, thickness [mm]
    Be: 0.125                      # (not the detector window, be_window_mm below)
  energy_step_keV: 0.03            # spectrum bin width [keV]
  current_mA: 0.002                # tube current [mA]; 0.002 reproduces the old
                                   # spectrum_xraytube.txt run, set the real value

# ── Instrument geometry (cm) ───────────────────────────────────────────────
# X-ray tube focal spot position
# 30° from surface normal, 3 cm vertical height → x = -3·tan(30°) = -3/√3
src_x: -3.0
src_y:  0.0
src_z:  3.0       # 3 cm above sample surface, 30° from normal

# SDD detector centre position
# 45° from surface normal, 3 cm vertical height → x = 3·tan(45°) = 3 cm
# source-to-detector distance = 1.7321 + 3.0 = 4.7321 cm
det_x:  3.0
det_y:  0.0
det_z:  3.0       # 3 cm above sample surface, 45° from normal

# Detector inward normal (unit vector pointing FROM detector TOWARD sample)
# Pointed at sample origin, consistent with 45° geometry
det_normal: [-0.707, 0.0, -0.707]   # will be normalised in code

# Detector active area (cm²)
det_area: 0.17    # 50 mm² = 0.50 cm² SDD

# ── Grid definition (cm) ──────────────────────────────────────────────────
# The grid covers the sample region you want to integrate over.
# Make it large enough to include all illuminated area that the
# detector can see. Start coarse (10×10) for testing.
grid_x_min: -0.4
grid_x_max:  0.4
grid_n_x:    2

grid_y_min: -0.4
grid_y_max:  0.4
grid_n_y:    2

# ── Detector response ────────────────────────────────────────────────────────
be_window_mm:           0.125   # Be entrance window thickness [mm]
si_active_layer_um:     450.0   # Active Si crystal thickness [µm] — sets high-E quantum efficiency
detector_fano:          0.115   # Fano factor for silicon (fixed)
detector_enc_electrons: 8.0     # Electronic noise [electrons equivalent] — adjust by calibration
